<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Неоновый Холст</title><style>
body{margin:0;background:#0d1117;overflow:hidden;font-family:sans-serif;}
.bar{position:absolute;top:10px;left:10px;color:white;background:#161b22;padding:10px;border-radius:8px;border:1px solid #30363d;}
canvas{display:block;cursor:crosshair;}
</style></head><body>
<div class="bar">🎨 Рисуй движением мыши/пальца</div>
<canvas id="cv"></canvas>
<script>
let c=document.getElementById('cv'); c.width=window.innerWidth; c.height=window.innerHeight;
let ctx=c.getContext('2d'), drawing=false;
window.onmousedown=()=>drawing=true; window.onmouseup=()=>drawing=false;
window.onmousemove=(e)=>{
    if(!drawing)return;
    ctx.fillStyle='#58a6ff';
    ctx.beginPath(); ctx.arc(e.clientX, e.clientY, 8, 0, Math.PI*2); ctx.fill();
};
window.ontouchmove=(e)=>{
    let t=e.touches[0];
    ctx.fillStyle='#3fb950';
    ctx.beginPath(); ctx.arc(t.clientX, t.clientY, 10, 0, Math.PI*2); ctx.fill();
};
</script></body></html>
