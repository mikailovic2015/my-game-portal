<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Восстановление пароля</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; width: 350px; box-sizing: border-box; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        button:hover { background: #2ea043; }
        .back { text-align: center; margin-top: 10px; }
        .back a { color: #58a6ff; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h3 style="color: #58a6ff; margin-bottom: 5px; margin-top: 0;">🔑 Восстановление пароля</h3>
        <p style="font-size: 12px; color: #8b949e; margin-bottom: 15px;">Введите ваш Gmail и решите капчу для генерации ссылки.</p>
        
        <input type="email" id="reset-email" placeholder="Ваш Gmail">
        
        <div style="background: #0d1117; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #30363d;">
            <p id="captcha-question" style="font-size: 13px; color: #c9d1d9; margin-top: 0; margin-bottom: 8px;"></p>
            <input type="number" id="captcha-input" placeholder="Ответ">
        </div>

        <button onclick="verifyAndGetResetLink()">Получить ссылку</button>
        
        <div id="reset-result-box" style="display: none; background: #0d1117; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #30363d; font-size: 12px; word-break: break-all;"></div>

        <div class="back">
            <a href="login.html">Назад ко входу</a>
        </div>
    </div>

    <script>
    const mathExamples = [
        { q: "5 + 7 =", a: 12 }, { q: "12 - 4 =", a: 8 }, { q: "6 * 3 =", a: 18 }, { q: "20 / 5 =", a: 4 }, { q: "9 + 9 =", a: 18 },
        { q: "15 - 6 =", a: 9 }, { q: "7 * 7 =", a: 49 }, { q: "32 / 8 =", a: 4 }, { q: "11 + 8 =", a: 19 }, { q: "14 - 9 =", a: 5 },
        { q: "4 * 6 =", a: 24 }, { q: "81 / 9 =", a: 9 }, { q: "13 + 7 =", a: 20 }, { q: "25 - 10 =", a: 15 }, { q: "5 * 5 =", a: 25 },
        { q: "36 / 6 =", a: 6 }, { q: "18 + 2 =", a: 20 }, { q: "30 - 12 =", a: 18 }, { q: "3 * 9 =", a: 27 }, { q: "45 / 5 =", a: 9 },
        { q: "16 + 16 =", a: 32 }, { q: "50 - 25 =", a: 25 }, { q: "8 * 8 =", a: 64 }, { q: "64 / 8 =", a: 8 }, { q: "19 + 11 =", a: 30 },
        { q: "22 - 7 =", a: 15 }, { q: "9 * 6 =", a: 54 }, { q: "40 / 4 =", a: 10 }, { q: "14 + 14 =", a: 28 }, { q: "60 - 20 =", a: 40 },
        { q: "7 * 8 =", a: 56 }, { q: "72 / 9 =", a: 8 }, { q: "25 + 25 =", a: 50 }, { q: "33 - 13 =", a: 20 }, { q: "4 * 9 =", a: 36 },
        { q: "54 / 6 =", a: 9 }, { q: "17 + 13 =", a: 30 }, { q: "44 - 11 =", a: 33 }, { q: "6 * 6 =", a: 36 }, { q: "48 / 6 =", a: 8 },
        { q: "21 + 9 =", a: 30 }, { q: "99 - 33 =", a: 66 }, { q: "9 * 9 =", a: 81 }, { q: "56 / 7 =", a: 8 }, { q: "12 + 18 =", a: 30 },
        { q: "75 - 25 =", a: 50 }, { q: "3 * 8 =", a: 24 }, { q: "28 / 4 =", a: 7 }, { q: "10 + 90 =", a: 100 }, { q: "100 - 50 =", a: 50 }
    ];

    let currentCorrectAnswer = 0;

    function initCaptcha() {
        const randomIndex = Math.floor(Math.random() * mathExamples.length);
        const selected = mathExamples[randomIndex];
        currentCorrectAnswer = selected.a;
        const qEl = document.getElementById("captcha-question");
        if (qEl) qEl.innerText = "Решите пример: " + selected.q;
    }

    function verifyAndGetResetLink() {
        const inputVal = document.getElementById("captcha-input").value;
        const userAnswer = parseInt(inputVal);
        const userEmail = document.getElementById("reset-email").value;
        
        if (isNaN(userAnswer) || userAnswer !== currentCorrectAnswer) {
            alert("Ошибка! Неверный ответ на пример. Попробуйте еще раз.");
            initCaptcha();
            return;
        }

        if (!userEmail) {
            alert("Введите ваш Gmail!");
            return;
        }

        const uniqueToken = Math.random().toString(36).substring(2) + Date.now().toString(36);
        const resetLink = `${window.location.origin}/reset-password.html?token=${uniqueToken}&email=${encodeURIComponent(userEmail)}`;

        const resultBox = document.getElementById("reset-result-box");
        if (resultBox) {
            resultBox.style.display = "block";
            resultBox.innerHTML = `<span style="color: #3fb950; font-weight: bold;">Капча пройдена успешно!</span><br>Вот ваша персональная ссылка для смены пароля:<br><br><a href="${resetLink}" target="_blank" style="color: #58a6ff; text-decoration: underline;">${resetLink}</a>`;
        }
    }

    window.onload = initCaptcha;
    </script>
</body>
</html>
