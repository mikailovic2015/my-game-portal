<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
        h2 { color: #f0f6fc; text-align: center; font-size: 20px; }
        p { font-size: 13px; color: #8b949e; text-align: center; }
        input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 10px; color: white; font-size: 14px; outline: none; }
        button { background: #1f6feb; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .link { text-align: center; font-size: 13px; color: #58a6ff; text-decoration: none; margin-top: 5px; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔄 Восстановление</h2>
        <p>Введите ваш Gmail, и мы сгенерируем ссылку для сброса пароля.</p>
        <input type="email" id="forgot-email" placeholder="Ваш Gmail">
        <button onclick="sendForgot()">Получить ссылку</button>
        <a href="/login.html" class="link">Назад ко входу</a>
    </div>

<script>
function sendForgot() {
    const email = document.getElementById('forgot-email').value.trim();
    if (!email) {
        alert('Введите Gmail!');
        return;
    }

    fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        if (data.success) {
            window.location.href = '/login.html';
        }
    });
}
</script>
</body>
</html>
