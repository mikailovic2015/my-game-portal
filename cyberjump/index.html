<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Неоновый Кибер-Прыг</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; background-color: #0d1117; font-family: sans-serif; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .game-container { position: relative; width: 100%; max-width: 480px; height: 100vh; max-height: 750px; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); box-shadow: 0 0 30px rgba(88, 166, 255, 0.2); overflow: hidden; display: flex; flex-direction: column; }
        canvas { display: block; width: 100%; height: 100%; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .header-hud { display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px rgba(88, 166, 255, 0.8); }
        .hud-panel { background: rgba(15, 23, 42, 0.7); border: 2px solid #58a6ff; padding: 8px 16px; border-radius: 12px; backdrop-filter: blur(5px); }
        .screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; transition: opacity 0.3s ease; z-index: 10; }
        .screen-overlay.hidden { opacity: 0; pointer-events: none; }
        h1 { font-size: 32px; margin-bottom: 10px; text-align: center; background: linear-gradient(90deg, #58a6ff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(88, 166, 255, 0.4); }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; text-align: center; padding: 0 20px; }
        .btn { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; border: none; padding: 14px 36px; font-size: 18px; font-weight: bold; border-radius: 14px; cursor: pointer; box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); transition: transform 0.1s ease, box-shadow 0.1s ease; pointer-events: auto; }
        .btn:active { transform: scale(0.95); box-shadow: 0 0 10px rgba(59, 130, 246, 0.8); }
        .controls-hint { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 13px; color: #64748b; pointer-events: none; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="ui-layer">
        <div class="header-hud">
            <div class="hud-panel" id="scoreDisplay">СЧЕТ: 0</div>
            <div class="hud-panel" id="coinsDisplay">💎 0</div>
        </div>
    </div>
    <div class="controls-hint">Тапай или жми Пробел для прыжка</div>
    <div id="startScreen" class="screen-overlay">
        <h1>КИБЕР-ПРЫГ</h1>
        <p>Пройди сквозь неоновый киберпространственный тоннель, собирай кристаллы и уворачивайся от ловушек!</p>
        <button class="btn" id="startBtn">ИГРАТЬ</button>
    </div>
    <div id="gameOverScreen" class="screen-overlay hidden">
        <h1>СИСТЕМА СБИТА</h1>
        <p id="finalScoreText">Твой результат: 0</p>
        <button class="btn" id="restartBtn">ПЕРЕЗАПУСК</button>
    </div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }
window.addEventListener('resize', resize);
resize();
let gameState = 'START', score = 0, coins = 0, gameSpeed = 4, gravity = 0.5;
const player = { x: 60, y: canvas.height / 2, size: 30, vy: 0, jumpForce: -9, color: '#58a6ff', trail: [] };
let platforms = [], particles = [], collectibles = [];
function spawnPlatform() {
    const minGap = 120, maxGap = 200;
    const lastPlatform = platforms[platforms.length - 1];
    const x = lastPlatform ? lastPlatform.x + lastPlatform.w + Math.floor(Math.random() * (maxGap - minGap + 1)) + minGap : canvas.width + 100;
    const w = Math.floor(Math.random() * (160 - 80 + 1)) + 80, h = 20, y = Math.floor(Math.random() * (canvas.height - 250 - 150 + 1)) + 150;
    platforms.push({ x, y, w, h });
    if (Math.random() > 0.4) {
        collectibles.push({ x: x + w / 2 - 12, y: y - 40, size: 24, collected: false, floatOffset: Math.random() * Math.PI });
    }
}
function initGame() {
    score = 0; coins = 0; gameSpeed = 4; platforms = []; particles = []; collectibles = [];
    player.y = canvas.height / 2; player.vy = 0; player.trail = [];
    platforms.push({ x: 30, y: canvas.height / 2 + 60, w: 200, h: 20 });
    for (let i = 0; i < 4; i++) { spawnPlatform(); }
}
function jump() {
    if (gameState === 'PLAYING') {
        player.vy = player.jumpForce;
        for (let i = 0; i < 8; i++) {
            particles.push({ x: player.x + player.size / 2, y: player.y + player.size, vx: (Math.random() - 0.5) * 4, vy: Math.random() * 3, size: Math.floor(Math.random() * (5 - 2 + 1)) + 2, color: '#58a6ff', life: 30 });
        }
    }
}
window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); } });
canvas.addEventListener('pointerdown', () => { jump(); });
document.getElementById('startBtn').addEventListener('click', () => { document.getElementById('startScreen').classList.add('hidden'); initGame(); gameState = 'PLAYING'; });
document.getElementById('restartBtn').addEventListener('click', () => { document.getElementById('gameOverScreen').classList.add('hidden'); initGame(); gameState = 'PLAYING'; });
function update() {
    if (gameState !== 'PLAYING') return;
    player.vy += gravity; player.y += player.vy;
    player.trail.push({ x: player.x, y: player.y });
    if (player.trail.length > 10) player.trail.shift();
    gameSpeed += 0.001; score += 0.1;
    for (let i = platforms.length - 1; i >= 0; i--) {
        let p = platforms[i]; p.x -= gameSpeed;
        if (player.x + player.size > p.x && player.x < p.x + p.w && player.y + player.size >= p.y && player.y + player.size - player.vy <= p.y + 10 && player.vy >= 0) {
            player.y = p.y - player.size; player.vy = 0;
        }
        if (p.x + p.w < -50) { platforms.splice(i, 1); spawnPlatform(); }
    }
    for (let i = collectibles.length - 1; i >= 0; i--) {
        let c = collectibles[i]; c.x -= gameSpeed; c.floatOffset += 0.1;
        const dx = (player.x + player.size/2) - (c.x + c.size/2);
        const dy = (player.y + player.size/2) - (c.y + c.size/2);
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < player.size/2 + c.size/2 && !c.collected) {
            c.collected = true; coins++;
            for (let j = 0; j < 12; j++) {
                particles.push({ x: c.x + c.size/2, y: c.y + c.size/2, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, size: Math.floor(Math.random() * (6 - 3 + 1)) + 3, color: '#a855f7', life: 25 });
            }
            collectibles.splice(i, 1);
        } else if (c.x + c.size < -50) { collectibles.splice(i, 1); }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
        let pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.life--; if (pt.life <= 0) particles.splice(i, 1);
    }
    if (player.y > canvas.height + 50 || player.y < -100) { gameOver(); }
    document.getElementById('scoreDisplay').innerText = `СЧЕТ: ${Math.floor(score)}`;
    document.getElementById('coinsDisplay').innerText = `💎 ${coins}`;
}
function gameOver() {
    gameState = 'GAMEOVER';
    document.getElementById('finalScoreText').innerText = `Твой результат: ${Math.floor(score)} | Кристаллов: ${coins}`;
    document.getElementById('gameOverScreen').classList.remove('hidden');
}
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(88, 166, 255, 0.05)'; ctx.lineWidth = 1;
    let gridSize = 40, offset = (Date.now() / 20) % gridSize;
    ctx.beginPath();
    for (let x = -offset; x < canvas.width; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
    ctx.stroke();
    for (let i = 0; i < player.trail.length; i++) {
        let t = player.trail[i], alpha = i / player.trail.length * 0.4;
        ctx.fillStyle = `rgba(88, 166, 255, ${alpha})`; ctx.fillRect(t.x, t.y, player.size, player.size);
    }
    ctx.shadowBlur = 15; ctx.shadowColor = '#58a6ff'; ctx.fillStyle = '#58a6ff';
    ctx.fillRect(player.x, player.y, player.size, player.size);
    ctx.shadowBlur = 0;
    platforms.forEach(p => {
        ctx.shadowBlur = 10; ctx.shadowColor = '#3b82f6'; ctx.fillStyle = '#1e293b';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#3b82f6'; ctx.fillRect(p.x, p.y, p.w, 4);
        ctx.shadowBlur = 0;
    });
    collectibles.forEach(c => {
        let floatY = c.y + Math.sin(c.floatOffset) * 6;
        ctx.shadowBlur = 12; ctx.shadowColor = '#a855f7'; ctx.fillStyle = '#c084fc';
        ctx.beginPath(); ctx.arc(c.x + c.size/2, floatY + c.size/2, c.size/2, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
    });
    particles.forEach(pt => { ctx.fillStyle = pt.color; ctx.fillRect(pt.x, pt.y, pt.size, pt.size); });
}
function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
