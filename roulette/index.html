<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Казино-Рулетка</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 15px 10px; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 420px; background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .back-link { display: block; text-align: left; color: #58a6ff; text-decoration: none; margin-bottom: 15px; font-size: 14px; font-weight: bold; }
        .title { font-size: 22px; font-weight: 800; color: #f0f6fc; margin-bottom: 15px; }

        .balance-badge { background: #010409; border: 1px solid #30363d; border-radius: 12px; padding: 10px; font-weight: 800; color: #e3b341; margin-bottom: 15px; font-size: 16px; }

        .wheel-display { width: 110px; height: 110px; border-radius: 50%; background: #21262d; border: 4px solid #30363d; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; transition: transform 0.5s ease-out; }
        .wheel-display.spinning { animation: spin 0.6s linear infinite; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .bets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .bet-btn { background: #010409; border: 1px solid #30363d; color: #c9d1d9; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .bet-btn.red { border-color: #f85149; color: #f85149; }
        .bet-btn.black { border-color: #8b949e; color: #c9d1d9; }
        .bet-btn.selected { background: #1f6feb; color: white; border-color: #388bfd; }

        .btn-main { width: 100%; background: #d29922; border: none; color: black; padding: 15px; font-size: 16px; font-weight: 800; border-radius: 12px; cursor: pointer; }
        .btn-main:active { transform: scale(0.98); }
        .status-msg { margin-top: 15px; font-size: 13px; min-height: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <a href="/" class="back-link">← На главную</a>
    <div class="title">🎰 Казино-Рулетка</div>

    <div class="balance-badge">Баланс: <span id="balance">1000</span> $</div>

    <div class="wheel-display" id="wheel">🎲</div>

    <div class="bets-grid">
        <button class="bet-btn red" onclick="selectBet('red', this)">🔴 Красное (x2)</button>
        <button class="bet-btn black" onclick="selectBet('black', this)">⚫ Чёрное (x2)</button>
    </div>

    <button class="btn-main" onclick="spin()">Крутить рулетку (Ставка: 100$)</button>

    <div class="status-msg" id="status">Сделайте вашу ставку!</div>
</div>

<script>
let balance = 1000;
let currentBet = null;
const redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];

function selectBet(type, btn) {
    currentBet = type;
    document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
}

function spin() {
    if (!currentBet) {
        document.getElementById('status').innerText = '⚠️ Выберите цвет ставки!';
        return;
    }
    if (balance < 100) {
        document.getElementById('status').innerText = '❌ Недостаточно средств!';
        return;
    }

    balance -= 100;
    document.getElementById('balance').innerText = balance;

    const wheel = document.getElementById('wheel');
    const status = document.getElementById('status');
    wheel.classList.add('spinning');
    status.innerText = 'Рулетка крутится...';

    setTimeout(() => {
        wheel.classList.remove('spinning');
        const num = Math.floor(Math.random() * 37);
        const color = num === 0 ? 'green' : (redNumbers.includes(num) ? 'red' : 'black');
        
        wheel.innerText = num;
        wheel.style.borderColor = color === 'red' ? '#f85149' : (color === 'black' ? '#8b949e' : '#3fb950');

        if (color === currentBet) {
            const win = 200;
            balance += win;
            status.innerText = `🎉 Выпало ${num} (${color === 'red' ? 'Красное' : 'Чёрное'}). Вы выиграли +100$!`;
            status.style.color = '#3fb950';
        } else {
            status.innerText = `💥 Выпало ${num}. Вы проиграли!`;
            status.style.color = '#f85149';
        }
        document.getElementById('balance').innerText = balance;
    }, 1200);
}
</script>

</body>
</html>
