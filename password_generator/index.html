<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ CYBER-KEY | Квантовый Генератор Паролей</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; text-align: center; padding: 15px 10px; margin: 0; min-height: 100vh; }
        .container { max-width: 460px; margin: 0 auto; background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .back-link { display: block; text-align: left; color: #58a6ff; text-decoration: none; margin-bottom: 15px; font-size: 14px; font-weight: bold; }
        .title { font-size: 22px; font-weight: 800; color: #58a6ff; margin-bottom: 15px; text-transform: uppercase; }
        
        .pass-box { background: #010409; border: 2px solid #30363d; border-radius: 12px; padding: 14px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .pass-text { font-family: monospace; font-size: 18px; font-weight: bold; color: #3fb950; letter-spacing: 1px; overflow-x: auto; white-space: nowrap; width: 100%; text-align: left; }
        .copy-btn { background: #238636; color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; flex-shrink: 0; }
        
        .strength-container { margin-bottom: 20px; text-align: left; }
        .strength-header { display: flex; justify-content: space-between; font-size: 12px; color: #8b949e; margin-bottom: 6px; font-weight: bold; }
        .strength-bar-bg { width: 100%; height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; }
        .strength-bar-fill { height: 100%; width: 0%; transition: width 0.4s ease, background-color 0.4s ease; }
        
        .controls-group { background: #010409; border: 1px solid #21262d; border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: left; }
        .slider-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; font-weight: bold; }
        .slider-val { color: #58a6ff; font-size: 16px; font-weight: 800; }
        input[type=range] { width: 100%; accent-color: #58a6ff; cursor: pointer; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .option-item { display: flex; align-items: center; gap: 8px; font-size: 13px; background: #161b22; padding: 8px 10px; border-radius: 8px; border: 1px solid #30363d; }
        
        .gen-btn { width: 100%; background: linear-gradient(135deg, #1f6feb, #238636); color: white; border: none; padding: 14px; font-size: 16px; font-weight: 800; border-radius: 10px; cursor: pointer; text-transform: uppercase; }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #238636; color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 14px; transition: all 0.3s ease; opacity: 0; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <a href="/" class="back-link">← На главную</a>
    <div class="title" style="color: #a371f7; text-shadow: 0 0 10px rgba(163, 113, 247, 0.5);">⚡ CYBER-KEY: КВАНТОВЫЙ ГЕНЕРАТОР</div>

    <div class="pass-box">
        <div class="pass-text" id="password_display">...</div>
        <button class="copy-btn" onclick="copyPassword()">📋 Копировать</button>
    </div>

    <div class="strength-container">
        <div class="strength-header">
            <span>Надежность: <strong id="strength_text">—</strong></span>
        </div>
        <div class="strength-bar-bg">
            <div class="strength-bar-fill" id="strength_bar"></div>
        </div>
    </div>

    <div class="controls-group">
        <div class="slider-header">
            <span>Длина пароля</span>
            <span class="slider-val" id="length_val">16</span>
        </div>
        <input type="range" id="length_slider" min="6" max="64" value="16" oninput="updateLength(this.value)">

        <div class="options-grid">
            <label class="option-item"><input type="checkbox" id="opt_upper" checked onchange="generate()"> A-Z</label>
            <label class="option-item"><input type="checkbox" id="opt_lower" checked onchange="generate()"> a-z</label>
            <label class="option-item"><input type="checkbox" id="opt_digits" checked onchange="generate()"> 0-9</label>
            <label class="option-item"><input type="checkbox" id="opt_symbols" checked onchange="generate()"> !@#$%</label>
        </div>
    </div>

    <button class="gen-btn" onclick="generate()">⚡ Сгенерировать</button>
</div>

<div class="toast" id="toast">✅ Скопировано в буфер!</div>

<script>
function updateLength(val) {
    document.getElementById("length_val").innerText = val;
    generate();
}

function generate() {
    let len = parseInt(document.getElementById("length_slider").value);
    let chars = "";
    if (document.getElementById("opt_upper").checked) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    if (document.getElementById("opt_lower").checked) chars += "abcdefghijklmnopqrstuvwxyz";
    if (document.getElementById("opt_digits").checked) chars += "0123456789";
    if (document.getElementById("opt_symbols").checked) chars += "!@#$%^&*()_+-=";
    
    if (!chars) chars = "abcdefghijklmnopqrstuvwxyz";

    let pass = "";
    for (let i = 0; i < len; i++) {
        pass += chars[Math.floor(Math.random() * chars.length)];
    }

    document.getElementById("password_display").innerText = pass;
    evaluateStrength(pass);
}

function evaluateStrength(pass) {
    let bar = document.getElementById("strength_bar");
    let text = document.getElementById("strength_text");
    if (pass.length < 8) {
        bar.style.width = "30%";
        bar.style.backgroundColor = "#f85149";
        text.innerText = "Слабый ⚠️";
        text.style.color = "#f85149";
    } else if (pass.length < 14) {
        bar.style.width = "65%";
        bar.style.backgroundColor = "#d29922";
        text.innerText = "Средний 🟡";
        text.style.color = "#d29922";
    } else {
        bar.style.width = "100%";
        bar.style.backgroundColor = "#3fb950";
        text.innerText = "Надежный 🟢";
        text.style.color = "#3fb950";
    }
}

function copyPassword() {
    let pass = document.getElementById("password_display").innerText;
    navigator.clipboard.writeText(pass);
    let toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2000);
}

generate();
</script>

</body>
</html>
