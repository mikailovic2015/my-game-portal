<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Генератор Ников</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 15px 10px; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 420px; background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .back-link { display: block; text-align: left; color: #58a6ff; text-decoration: none; margin-bottom: 15px; font-size: 14px; font-weight: bold; }
        .title { font-size: 22px; font-weight: 800; color: #f0f6fc; margin-bottom: 20px; }

        .nick-box { background: #010409; border: 1px solid #30363d; border-radius: 12px; padding: 18px; font-size: 20px; font-weight: 800; color: #e3b341; margin-bottom: 15px; cursor: pointer; }

        .btn-main { width: 100%; background: #388bfd; border: none; color: white; padding: 15px; font-size: 16px; font-weight: 800; border-radius: 12px; cursor: pointer; }
        .btn-main:active { transform: scale(0.98); }
        
        .toast { margin-top: 10px; font-size: 12px; color: #3fb950; opacity: 0; transition: opacity 0.2s; font-weight: bold; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <a href="/" class="back-link">← На главную</a>
    <div class="title">⚡ Генератор Ников</div>

    <div class="nick-box" id="nick_display" onclick="copyNick()">CyberNinja_99</div>

    <button class="btn-main" onclick="generate()">Сгенерировать</button>

    <div class="toast" id="toast">Скопировано в буфер!</div>
</div>

<script>
const prefixes = ['Cyber', 'Shadow', 'Neo', 'Dark', 'Ghost', 'Phantom', 'Alpha', 'Vortex', 'Pixel', 'Toxic'];
const suffixes = ['Ninja', 'Slayer', 'Rider', 'Hunter', 'Master', 'Knight', 'Viper', 'Lord', 'Strike', 'Pulse'];

function generate() {
    const p = prefixes[Math.floor(Math.random() * prefixes.length)];
    const s = suffixes[Math.floor(Math.random() * suffixes.length)];
    const num = Math.floor(Math.random() * 99) + 1;
    document.getElementById('nick_display').innerText = `${p}${s}_${num}`;
}

function copyNick() {
    const text = document.getElementById('nick_display').innerText;
    navigator.clipboard.writeText(text);
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1200);
}
</script>

</body>
</html>
