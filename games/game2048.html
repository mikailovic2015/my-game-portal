<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>2048</title>
    <style>
        body { background: #faf8ef; color: #776e65; text-align: center; font-family: sans-serif; padding-top: 30px; }
        .board { display: inline-grid; grid-template-columns: repeat(2, 90px); gap: 10px; background: #bbada0; padding: 10px; border-radius: 6px; }
        .tile { width: 90px; height: 90px; background: #cdc1b4; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: #eee4da; border-radius: 4px; }
        button { margin-top: 15px; padding: 10px 20px; background: #8f7a66; color: #fff; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Мини 2048</h2>
    <div class="board">
        <div class="tile" id="t0">2</div><div class="tile" id="t1">2</div>
        <div class="tile" id="t2">4</div><div class="tile" id="t3">8</div>
    </div>
    <div><button onclick="mix()">Смешать</button></div>
    <script>
        function mix() {
            let nums = [2, 4, 8, 16, 32];
            for(let i=0; i<4; i++) {
                document.getElementById('t'+i).innerText = nums[Math.floor(Math.random()*nums.length)];
            }
        }
    </script>
</body>
</html>
