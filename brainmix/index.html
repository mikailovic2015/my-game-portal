<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Зеркало Мозга</title><style>
body{margin:0;background:#0d1117;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;}
.box{background:#161b22;padding:30px;border:1px solid #30363d;border-radius:12px;text-align:center;width:300px;}
h1{font-size:36px;margin:20px 0;}
button{padding:10px 20px;margin:5px;background:#238636;color:white;border:none;border-radius:6px;cursor:pointer;font-size:16px;}
</style></head><body>
<div class="box">
    <h2>🧠 Назови цвет слова!</h2>
    <h1 id="word">КРАСНЫЙ</h1>
    <div id="btns">
        <button onclick="check('red')" style="background:#f85149">Красный</button>
        <button onclick="check('blue')" style="background:#58a6ff">Синий</button>
        <button onclick="check('green')" style="background:#3fb950">Зеленый</button>
    </div>
    <p id="res" style="margin-top:15px;"></p>
</div>
<script>
const colors=[{text:'КРАСНЫЙ',val:'red',color:'#58a6ff'},{text:'СИНИЙ',val:'blue',color:'#3fb950'},{text:'ЗЕЛЕНЫЙ',val:'green',color:'#f85149'}];
let current=0;
function next(){
    current=Math.floor(Math.random()*colors.length);
    let w=document.getElementById('word');
    w.innerText=colors[current].text;
    w.style.color=colors[Math.floor(Math.random()*colors.length)].color;
}
function check(v){
    let r=document.getElementById('res');
    if(v===colors[current].val){ r.innerText='✅ Верно!'; r.style.color='#3fb950'; }
    else{ r.innerText='❌ Ошибка!'; r.style.color='#f85149'; }
    next();
}
next();
</script></body></html>
