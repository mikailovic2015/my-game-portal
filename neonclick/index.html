<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Неоновый Клик</title><style>
body{margin:0;background:#0d1117;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;}
button{padding:25px 50px;font-size:28px;background:#238636;color:white;border:none;border-radius:12px;cursor:pointer;box-shadow:0 0 15px rgba(35,134,54,0.4);transition:0.1s;}

</style></head><body>
<h1>⚡ Неоновый Клик</h1>
<h2 id="score">Счет: 0</h2>
<button onclick="s++;document.getElementById('score').innerText='Счет: '+s">ЖМИ!</button>
<script>let s=0;</script></body></html>
