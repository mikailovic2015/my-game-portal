<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Камень Ножницы Бумага</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 15px 10px; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 420px; background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .back-link { display: block; text-align: left; color: #58a6ff; text-decoration: none; margin-bottom: 15px; font-size: 14px; font-weight: bold; }
        .title { font-size: 20px; font-weight: 800; color: #f0f6fc; margin-bottom: 15px; }

        .btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .btn-item { background: #21262d; border: 1px solid #30363d; color: white; padding: 16px; border-radius: 14px; font-size: 28px; cursor: pointer; flex: 1; transition: transform 0.15s; }
        .btn-item:active { transform: scale(0.92); }

        .status { font-size: 15px; font-weight: 700; color: #e3b341; min-height: 40px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="container">
    <a href="/" class="back-link">← На главную</a>
    <div class="title">✊ Камень Ножницы Бумага</div>

    <div class="btn-group">
        <button class="btn-item" onclick="play('✊')">✊</button>
        <button class="btn-item" onclick="play('✌️')">✌️</button>
        <button class="btn-item" onclick="play('✋')">✋</button>
    </div>

    <div class="status" id="status">Сделай свой ход!</div>
</div>

<script>
const items = ['✊', '✌️', '✋'];

function play(player) {
    const bot = items[Math.floor(Math.random() * items.length)];
    const status = document.getElementById('status');

    if (player === bot) {
        status.innerText = `🤝 Ничья! Вы оба выбрали ${player}`;
    } else if (
        (player === '✊' && bot === '✌️') ||
        (player === '✌️' && bot === '✋') ||
        (player === '✋' && bot === '✊')
    ) {
        status.innerText = `🎉 Победа! ${player} побеждает ${bot}`;
    } else {
        status.innerText = `💥 Поражение! ${bot} побеждает ${player}`;
    }
}
</script>

</body>
</html>
