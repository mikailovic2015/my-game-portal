<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Тест Реакции</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 15px 10px; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 420px; background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .back-link { display: block; text-align: left; color: #58a6ff; text-decoration: none; margin-bottom: 15px; font-size: 14px; font-weight: bold; }
        .title { font-size: 22px; font-weight: 800; color: #f0f6fc; margin-bottom: 15px; }

        .target-box { width: 100%; height: 220px; border-radius: 14px; background: #21262d; border: 2px dashed #30363d; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; user-select: none; transition: background 0.15s, border-color 0.15s; margin-bottom: 20px; padding: 10px; }
        .target-box.waiting { background: #da3633; border-color: #f85149; }
        .target-box.ready { background: #238636; border-color: #3fb950; }

        .target-text { font-size: 20px; font-weight: 800; color: #ffffff; }
        .sub-text { font-size: 13px; color: #8b949e; margin-top: 8px; }
        
        .stats { display: flex; justify-content: space-around; background: #010409; padding: 12px; border-radius: 10px; border: 1px solid #30363d; font-size: 13px; font-weight: 600; }
        .stat-val { color: #58a6ff; }
    </style>
</head>
<body>

<div class="container">
    <a href="/" class="back-link">← На главную</a>
    <div class="title">⚡ Тест Реакции</div>

    <div class="target-box" id="box" onclick="handleClick()">
        <div class="target-text" id="main_text">Нажми, чтобы начать</div>
        <div class="sub-text" id="sub_text">Жди зелёного цвета</div>
    </div>

    <div class="stats">
        <div>Рекорд: <span class="stat-val" id="best_score">—</span></div>
        <div>Попыток: <span class="stat-val" id="tries_count">0</span></div>
    </div>
</div>

<script>
let state = 'idle'; // idle, waiting, ready
let timer = null;
let startTime = 0;
let best = localStorage.getItem('reaction_best') || null;
let tries = 0;

if(best) document.getElementById('best_score').innerText = best + ' ms';

function handleClick() {
    const box = document.getElementById('box');
    const mainText = document.getElementById('main_text');
    const subText = document.getElementById('sub_text');

    if (state === 'idle') {
        state = 'waiting';
        box.className = 'target-box waiting';
        mainText.innerText = 'Жди зелёного...';
        subText.innerText = 'Не нажимай раньше времени!';

        const delay = Math.floor(Math.random() * 3000) + 2000;
        timer = setTimeout(() => {
            state = 'ready';
            box.className = 'target-box ready';
            mainText.innerText = 'ЖМИ!';
            subText.innerText = 'Быстрее!';
            startTime = Date.now();
        }, delay);

    } else if (state === 'waiting') {
        clearTimeout(timer);
        state = 'idle';
        box.className = 'target-box';
        mainText.innerText = '❌ Слишком рано!';
        subText.innerText = 'Нажми, чтобы попробовать снова';

    } else if (state === 'ready') {
        const result = Date.now() - startTime;
        state = 'idle';
        tries++;
        document.getElementById('tries_count').innerText = tries;

        if (!best || result < best) {
            best = result;
            localStorage.setItem('reaction_best', best);
            document.getElementById('best_score').innerText = best + ' ms';
        }

        box.className = 'target-box';
        mainText.innerText = `${result} ms`;
        subText.innerText = 'Отличный результат! Нажми для повтора';
    }
}
</script>

</body>
</html>
