<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Игровой Портал</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
        h2 { color: #f0f6fc; text-align: center; font-size: 20px; }
        input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 10px; color: white; font-size: 14px; outline: none; }
        button { background: #1f6feb; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .link { text-align: center; font-size: 13px; color: #58a6ff; text-decoration: none; margin-top: 5px; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📝 Регистрация</h2>
        <input type="email" id="reg-email" placeholder="Gmail">
        <input type="text" id="reg-name" placeholder="Никнейм">
        <input type="password" id="reg-pass" placeholder="Пароль">
        <button onclick="doRegister()">Зарегистрироваться</button>
        <a href="/login.html" class="link">Уже есть аккаунт? Войти</a>
        <a href="/" class="link" style="color: #8b949e;">На главную</a>
    </div>

<script>
const MAIN_LOCALHOST_URL = window.location.origin;

function doRegister() {
    const email = document.getElementById('reg-email').value.trim();
    const username = document.getElementById('reg-name').value.trim();
    const password = document.getElementById('reg-pass').value.trim();

    if (!email || !username || !password) {
        alert('Заполни все поля!');
        return;
    }

    fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, username, password })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            window.location.href = MAIN_LOCALHOST_URL;
        } else {
            alert(data.error || 'Ошибка регистрации');
        }
    })
    .catch(err => {
        alert('Ошибка соединения с сервером');
    });
}
</script>
</body>
</html>
