<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Мой Игровой Портал</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body { 
            background: #0d1117; 
            color: #c9d1d9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            min-height: 100vh; 
            padding: 20px 12px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container { width: 100%; max-width: 600px; }

        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { font-size: 24px; font-weight: 900; color: #f0f6fc; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header p { font-size: 13px; color: #8b949e; margin-top: 4px; }

        .auth-portal-card {
            background: #161b22; border: 1px solid #30363d; border-radius: 12px;
            padding: 16px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; text-align: center;
        }
        .auth-portal-card p { font-size: 13px; color: #8b949e; }
        .auth-buttons-row { display: flex; gap: 10px; }
        .btn-link-login { flex: 1; background: #238636; color: white; text-decoration: none; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 13px; text-align: center; }
        .btn-link-reg { flex: 1; background: #1f6feb; color: white; text-decoration: none; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 13px; text-align: center; }

        /* Кошелек и баланс */
        .wallet-card {
            background: linear-gradient(135deg, #161b22, #21262d); border: 1px solid #30363d; border-radius: 12px;
            padding: 14px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .wallet-balances { display: flex; justify-content: space-around; background: #0d1117; padding: 10px; border-radius: 8px; border: 1px solid #30363d; }
        .balance-item { text-align: center; font-size: 13px; font-weight: bold; }

        .logged-panel {
            background: #161b22; border: 1px solid #30363d; border-radius: 12px;
            padding: 14px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px;
        }
        .challenge-btn { background: #da3633; color: white; border: none; padding: 9px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; width: 100%; }
        .admin-btn { background: #8957e5; color: white; border: none; padding: 9px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; width: 100%; display: none; }
        .tourn-create-btn { background: #238636; color: white; border: none; padding: 9px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; width: 100%; display: none; }
        .donate-shop-btn { background: #d29922; color: white; border: none; padding: 9px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; width: 100%; }
        .donate-check-btn { background: #1f6feb; color: white; border: none; padding: 9px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; width: 100%; display: none; }

        .badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; }
        .badge-owner { background: #b62324; color: white; }
        .badge-admin { background: #8957e5; color: white; }
        .badge-moderator { background: #1f6feb; color: white; }
        .badge-esports { background: #2ea043; color: white; }
        .badge-vip { background: #d29922; color: white; }
        .badge-player { background: #30363d; color: #8b949e; }

        .tournament-banner {
            background: linear-gradient(135deg, #1f6feb22, #8957e522); border: 1px solid #8957e5; border-radius: 12px;
            padding: 14px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 6px; text-align: center;
        }
        .tournament-banner h3 { color: #f0f6fc; font-size: 15px; }
        .tournament-banner p { color: #8b949e; font-size: 12px; }
        .btn-join-tourn { background: #8957e5; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; text-decoration: none; margin-top: 4px; display: inline-block; }

        .leaderboard-card {
            background: #161b22; border: 1px solid #30363d; border-radius: 12px;
            padding: 14px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px;
        }
        .leaderboard-title { font-size: 13px; font-weight: 800; color: #3fb950; display: flex; align-items: center; gap: 6px; }
        .leaderboard-item { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 8px; background: #0d1117; border-radius: 6px; border: 1px solid #21262d; }

        .search-box { position: relative; margin-bottom: 15px; }
        .search-input {
            width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 14px;
            padding: 12px 16px 12px 42px; font-size: 14px; color: #e6edf3; outline: none;
        }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; opacity: 0.6; }

        .section-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #f78166; margin: 15px 0 10px 4px; }
        .section-title.blue { color: #58a6ff; }

        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (min-width: 480px) { .games-grid { grid-template-columns: repeat(3, 1fr); } }

        .game-card {
            background: #161b22; border: 1px solid #30363d; border-radius: 14px;
            padding: 14px 10px; text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .game-card:active { transform: scale(0.96); background: #21262d; }
        .game-icon { font-size: 26px; margin-bottom: 8px; }
        .game-title { font-size: 13px; font-weight: 700; color: #f0f6fc; line-height: 1.2; }

        /* Модальные окна */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-content {
            background: #161b22; border: 1px solid #30363d; border-radius: 16px; width: 100%; max-width: 450px;
            max-height: 80vh; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
        }
        .modal-item {
            background: #0d1117; border: 1px solid #30363d; padding: 12px; border-radius: 10px;
            color: white; display: flex; align-items: center; justify-content: space-between; font-size: 13px;
        }
        .user-actions { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
        .btn-kick { background: #d29922; color: white; border: none; padding: 5px 6px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-ban { background: #da3633; color: white; border: none; padding: 5px 6px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .role-select { background: #161b22; color: white; border: 1px solid #30363d; border-radius: 4px; padding: 4px; font-size: 11px; }
        .modal-input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px; color: white; font-size: 13px; outline: none; }
        
        .donate-card-pkg { background: #0d1117; border: 1px solid #30363d; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-buy-pkg { background: #238636; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>



</body>
</html>
