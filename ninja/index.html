<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Ниндзя-Кайф</title><style>
body{margin:0;background:#0d1117;color:white;text-align:center;overflow:hidden;height:100vh;font-family:sans-serif;}
#player{width:35px;height:35px;background:#3fb950;position:absolute;bottom:20px;left:50%;border-radius:6px;transform:translateX(-50%);}
.shuriken{width:25px;height:25px;background:#f85149;position:absolute;top:0;border-radius:50%;}
</style></head><body>
<h2>🥷 Уклоняйся от сюрикенов!</h2>
<div id="player"></div>
<script>
let p=document.getElementById('player');
document.onmousemove=(e)=>{ p.style.left = e.clientX + 'px'; };
document.ontouchmove=(e)=>{ p.style.left = e.touches[0].clientX + 'px'; };
setInterval(()=>{
    let s=document.createElement('div'); s.className='shuriken';
    s.style.left = Math.random()*window.innerWidth + 'px';
    document.body.appendChild(s);
    let anim=s.animate([{top:'0px'},{top:window.innerHeight+'px'}],{duration:1500});
    anim.onfinish=()=>s.remove();
}, 400);
</script></body></html>
