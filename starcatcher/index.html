<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Космический Сбор</title><style>
body{margin:0;background:#05070b;color:white;overflow:hidden;text-align:center;font-family:sans-serif;}
h2{position:relative;z-index:10;}
.star{position:absolute;font-size:30px;cursor:pointer;}
</style></head><body>
<h2>🚀 Космический Сбор | Очки: <span id="sc">0</span></h2>
<script>
let score=0, sc=document.getElementById('sc');
setInterval(()=>{
    let s=document.createElement('div'); s.className='star';
    s.innerHTML='⭐';
    s.style.left = Math.random()*(window.innerWidth-50) + 'px';
    s.style.top = '0px';
    s.onclick=()=>{ score++; sc.innerText=score; s.remove(); };
    document.body.appendChild(s);
    let anim=s.animate([{top:'0px'},{top:window.innerHeight+'px'}],{duration:2500});
    anim.onfinish=()=>s.remove();
}, 600);
</script></body></html>
